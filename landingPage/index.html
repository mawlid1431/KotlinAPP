<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>TDM Insight — Vancomycin TDM calculator for pharmacy students</title>
    <meta
      name="description"
      content="TDM Insight is an academic Android app for vancomycin therapeutic drug monitoring. Enter a fictional patient case, derive PK parameters, and get a step-by-step formula walkthrough."
    />
    <meta name="theme-color" content="#1464A8" />

    <!-- TDM Insight flask mark. ?v=2 busts browser/CDN caches still holding
         the icons that shipped with the original template. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="mask-icon" href="/favicon.svg?v=2" color="#1464A8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Red+Hat+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Boot splash — inlined so it paints on the first frame before the bundle loads. -->
    <style>
      /* ── Root container ── */
      #ke-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 55% at 22% 10%, rgba(20, 100, 168, 0.12), transparent 62%),
          radial-gradient(ellipse 55% 50% at 86% 80%, rgba(20, 100, 168, 0.08), transparent 62%),
          radial-gradient(ellipse 40% 35% at 50% 50%, rgba(20, 100, 168, 0.04), transparent 70%),
          linear-gradient(180deg, #eef5fb 0%, #f8fafc 100%);
        font-family: 'Manrope', 'Plus Jakarta Sans', system-ui, sans-serif;
        /* Fade-out when dismissed */
        transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1),
                    visibility 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #ke-boot[data-done='true'] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Decorative background dots ── */
      #ke-boot::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(20, 100, 168, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 30%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 30%, transparent 80%);
        pointer-events: none;
      }

      /* ── Logo ring wrapper ── */
      #ke-boot .ring {
        position: relative;
        height: 120px;
        width: 120px;
        display: grid;
        place-items: center;
        /* Zoom in from 30% with spring ease, then settle */
        animation: ke-logo-zoom 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      }

      @keyframes ke-logo-zoom {
        0% {
          opacity: 0;
          transform: scale(0.25);
          filter: blur(8px);
        }
        60% {
          opacity: 1;
          filter: blur(0px);
        }
        80% {
          transform: scale(1.06);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0px);
        }
      }

      /* ── Spinning arc around the logo ── */
      #ke-boot .arc {
        position: absolute;
        inset: -6px;
        height: calc(100% + 12px);
        width: calc(100% + 12px);
        animation: ke-boot-spin 1.8s linear infinite;
        /* Arc starts spinning once logo arrives */
        animation-delay: 0.5s;
        opacity: 0;
        animation-fill-mode: forwards;
      }

      @keyframes ke-boot-spin {
        0%   { transform: rotate(0deg);   opacity: 1; }
        100% { transform: rotate(360deg); opacity: 1; }
      }

      #ke-boot .arc .track {
        fill: none;
        stroke: rgba(20, 100, 168, 0.13);
        stroke-width: 2;
      }

      #ke-boot .arc .head {
        fill: none;
        stroke: #1464A8;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 55 230;
        animation: ke-arc-breathe 2.8s ease-in-out infinite;
        animation-delay: 0.5s;
      }

      @keyframes ke-arc-breathe {
        0%, 100% { stroke-dasharray: 42 230; }
        50%       { stroke-dasharray: 90 230; }
      }

      /* ── Logo tile (the icon inside the ring) ── */
      #ke-boot .core {
        height: 72px;
        width: 72px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 22px;
        background: #ffffff;
        box-shadow:
          0 0 0 1px rgba(20, 100, 168, 0.10),
          0 8px 32px -6px rgba(20, 100, 168, 0.30),
          0 24px 48px -12px rgba(20, 100, 168, 0.15);
        /* Subtle inner pulse after zoom lands */
        animation: ke-core-glow 3s ease-in-out infinite;
        animation-delay: 1s;
      }

      @keyframes ke-core-glow {
        0%, 100% {
          box-shadow:
            0 0 0 1px rgba(20, 100, 168, 0.10),
            0 8px 32px -6px rgba(20, 100, 168, 0.30),
            0 24px 48px -12px rgba(20, 100, 168, 0.15);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(20, 100, 168, 0.18),
            0 8px 32px -6px rgba(20, 100, 168, 0.45),
            0 24px 48px -12px rgba(20, 100, 168, 0.25);
        }
      }

      #ke-boot .core img {
        height: 100%;
        width: 100%;
        object-fit: contain;
        padding: 12px;
      }

      /* ── Brand name ── */
      #ke-boot .wordmark {
        margin-top: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translateY(14px);
        animation: ke-text-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 0.75s;
      }

      @keyframes ke-text-rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #ke-boot .label {
        font-family: 'Red Hat Display', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #0d1a2a;
        text-align: center;
        margin: 0;
        line-height: 1;
      }

      #ke-boot .tag {
        margin: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #1464A8;
        text-align: center;
        opacity: 0.85;
      }

      /* ── Progress bar ── */
      #ke-boot .bar-wrap {
        margin-top: 36px;
        opacity: 0;
        animation: ke-text-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 1.05s;
      }

      #ke-boot .bar {
        position: relative;
        height: 3px;
        width: 140px;
        overflow: hidden;
        border-radius: 100px;
        background: rgba(20, 100, 168, 0.12);
      }

      #ke-boot .bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -50%;
        width: 45%;
        border-radius: 100px;
        background: linear-gradient(
          90deg,
          transparent,
          #1464A8,
          transparent
        );
        animation: ke-bar-slide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        animation-delay: 1.05s;
      }

      @keyframes ke-bar-slide {
        0%   { left: -50%; }
        100% { left: 110%; }
      }

      /* ── Reduced-motion: skip to static state ── */
      @media (prefers-reduced-motion: reduce) {
        #ke-boot .ring        { animation: none; opacity: 1; }
        #ke-boot .arc         { animation: none; opacity: 1; }
        #ke-boot .arc .head   { animation: none; }
        #ke-boot .core        { animation: none; }
        #ke-boot .wordmark    { animation: none; opacity: 1; transform: none; }
        #ke-boot .bar-wrap    { animation: none; opacity: 1; }
        #ke-boot .bar::after  { animation: none; left: 0; width: 100%; opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <div id="ke-boot" role="status" aria-label="TDM Insight loading">
      <div class="ring">
        <svg class="arc" viewBox="0 0 132 132" aria-hidden="true">
          <circle class="track" cx="66" cy="66" r="58" />
          <circle class="head"  cx="66" cy="66" r="58" />
        </svg>
        <span class="core">
          <img src="/favicon.svg" alt="" width="72" height="72" />
        </span>
      </div>

      <div class="wordmark">
        <p class="label">TDM Insight</p>
        <p class="tag">Calculate · Monitor · Dose</p>
      </div>

      <div class="bar-wrap">
        <div class="bar"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
